# 3주차 DAY 5 실습: main에 올리면 화면을 빌드해서 깃헙 페이지스에 자동 배포해요(CI/CD).
name: 깃헙 페이지스 자동 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 이 앱은 bun.lock(번)으로 부품 버전을 고정해 두었어요. npm으로 설치하면 버전이 충돌해요.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # 깃헙 페이지스 주소는 /저장소이름/ 아래에 열리므로 base를 맞춰요.
      - run: bunx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
